<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LINE リアルタイムチャット</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  
  <!-- Firebase 基础 SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <!-- Firebase Firestore SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <!-- Firebase Auth SDK (新增) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    input, textarea {
      -webkit-user-select: auto;
      user-select: auto;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #EDEDED;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Helvetica Neue", Meiryo, sans-serif;
    }
    #app {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
    .header {
      height: 48px;
      background: #EDEDED;
      border-bottom: 1px solid #DCDCDC;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
      z-index: 10;
    }
    .header-title {
      font-size: 15px;
      font-weight: 600;
      color: #181818;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .header-btn {
      font-size: 13px;
      color: #06C755;
      background: transparent;
      border: none;
      padding: 4px 6px;
      font-weight: bold;
    }
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .system-tip {
      align-self: center;
      background: rgba(0,0,0,0.15);
      color: #FFF;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      max-width: 80%;
      text-align: center;
    }
    .msg-row {
      display: flex;
      gap: 8px;
      position: relative;
    }
    .msg-row.self {
      flex-direction: row-reverse;
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
      color: #FFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
      overflow: hidden;
      position: relative;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .msg-content {
      max-width: 68%;
      display: flex;
      flex-direction: column;
    }
    .user-name {
      font-size: 11px;
      color: #888;
      margin-bottom: 3px;
    }
    .self .user-name {
      text-align: right;
    }
    .bubble {
      background: #FFFFFF;
      color: #111;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-word;
      position: relative;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .self .bubble {
      background: #85E249;
      color: #000;
    }
    .img-bubble {
      max-width: 180px;
      border-radius: 6px;
      display: block;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
      cursor: pointer;
    }
    .popover-menu {
      position: absolute;
      top: -36px;
      background: #4C4C4C;
      color: #FFF;
      border-radius: 4px;
      padding: 4px 8px;
      display: flex;
      gap: 12px;
      font-size: 12px;
      z-index: 100;
      white-space: nowrap;
    }
    .popover-menu::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 4px 4px 0;
      border-style: solid;
      border-color: #4C4C4C transparent;
    }
    .input-bar {
      background: #F7F7F7;
      border-top: 1px solid #DCDCDC;
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .input-box {
      flex: 1;
      background: #FFF;
      border: 1px solid #DDD;
      border-radius: 4px;
      padding: 8px;
      font-size: 15px;
      outline: none;
      max-height: 80px;
    }
    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1.5px solid #7F7F7F;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #7F7F7F;
      background: transparent;
    }
    .send-btn {
      background: #06C755;
      color: #FFF;
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: 500;
    }
    .more-panel {
      height: 100px;
      background: #F7F7F7;
      border-top: 1px solid #DDD;
      display: flex;
      padding: 16px;
      gap: 24px;
    }
    .panel-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #666;
    }
    .panel-icon-box {
      width: 48px;
      height: 48px;
      background: #FFF;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      border: 1px solid #E0E0E0;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 500;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .members-card {
      width: 85%;
      max-width: 360px;
      max-height: 70vh;
      background: #FFF;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .members-card-header {
      padding: 14px 16px;
      background: #F7F7F7;
      border-bottom: 1px solid #EEE;
      font-size: 15px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .members-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .member-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #F0F0F0;
    }
    .member-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .status-dot.online {
      background-color: #06C755;
      box-shadow: 0 0 4px #06C755;
    }
    .status-dot.offline {
      background-color: #CCC;
    }
    .member-name {
      font-size: 14px;
      color: #333;
    }
    .member-status-text {
      font-size: 11px;
      color: #888;
    }

    .image-viewer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .image-viewer-overlay img {
      max-width: 95vw;
      max-height: 90vh;
      object-fit: contain;
    }
  </style>
</head>
<body>
<div id="app" @click="activeMsgId = null">
  <!-- 顶部 Header -->
  <div class="header">
    <div class="header-title">{{ currentGroup.name || 'LINE チャット' }}</div>
    <div class="header-actions">
      <button class="header-btn" @click.stop="showMembersModal = true">👥 メンバー({{ membersList.length }})</button>
      <button class="header-btn" @click.stop="createGroup">作成</button>
      <button class="header-btn" @click.stop="shareGroup">招待</button>
    </div>
  </div>

  <!-- 消息展示区 -->
  <div class="chat-container" ref="chatBox">
    <div v-for="msg in messages" :key="msg.id" class="msg-row" :class="{ self: msg.uid === user.userId }">
      <template v-if="msg.type === 'system'">
        <div class="system-tip">{{ msg.text }}</div>
      </template>

      <template v-else>
        <div class="avatar" :style="{ backgroundColor: getAvatarBgColor(msg.uid || msg.displayName) }">
          <img v-if="msg.avatar" :src="msg.avatar" @error="handleImgError">
          <span v-else>{{ (msg.displayName || 'ユ').charAt(0) }}</span>
        </div>

        <div class="msg-content">
          <div class="user-name" v-if="msg.uid !== user.userId">{{ msg.displayName }}</div>
          <div style="position:relative;">
            <div v-if="activeMsgId === msg.id && msg.uid === user.userId && !msg.recalled" class="popover-menu">
              <span v-if="msg.type === 'text'" @click.stop="editMessage(msg)">編集</span>
              <span @click.stop="recallMessage(msg.id)">送信取消</span>
            </div>
            <div v-if="msg.type === 'text'" class="bubble" @click.stop="toggleMenu(msg.id)">
              {{ msg.recalled ? 'メッセージの送信を取り消しました' : msg.text }}
              <span v-if="msg.edited && !msg.recalled" style="font-size:10px; opacity:0.6; margin-left:4px;">(編集済み)</span>
            </div>
            <img v-else-if="msg.type === 'image' && !msg.recalled" :src="msg.url" class="img-bubble" @click.stop="previewImage(msg.url)">
            <div v-else-if="msg.recalled" class="system-tip">メッセージの送信を取り消しました</div>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- 底部输入栏 -->
  <div class="input-bar">
    <input type="text" class="input-box" v-model="inputText" placeholder="メッセージを入力..." @keyup.enter="sendText">
    <button v-if="inputText.trim()" class="send-btn" @click="sendText">送信</button>
    <button v-else class="icon-btn" @click.stop="showPanel = !showPanel">+</button>
  </div>

  <!-- 扩展功能面板 -->
  <div class="more-panel" v-if="showPanel">
    <div class="panel-item" @click="triggerImageUpload">
      <div class="panel-icon-box">🖼️</div>
      <span>写真</span>
    </div>
    <div class="panel-item" @click="triggerAvatarUpload">
      <div class="panel-icon-box">👤</div>
      <span>アイコン変更</span>
    </div>
    
    <input type="file" ref="fileInput" accept="image/*" style="display:none" @change="uploadImage">
    <input type="file" ref="avatarInput" accept="image/*" style="display:none" @change="onAvatarFileSelect">
  </div>

  <!-- 群成员列表弹窗 -->
  <div class="modal-overlay" v-if="showMembersModal" @click.self="showMembersModal = false">
    <div class="members-card">
      <div class="members-card-header">
        <span>グループメンバー ({{ membersList.length }})</span>
        <span style="cursor:pointer; color:#888;" @click="showMembersModal = false">✕</span>
      </div>
      <div class="members-list">
        <div class="member-item" v-for="m in membersList" :key="m.uid">
          <div class="member-info">
            <div class="avatar" style="width:32px; height:32px; font-size:12px;" :style="{ backgroundColor: getAvatarBgColor(m.uid || m.displayName) }">
              <img v-if="m.avatar" :src="m.avatar" @error="handleImgError">
              <span v-else>{{ (m.displayName || 'ユ').charAt(0) }}</span>
            </div>
            <span class="member-name">{{ m.displayName }}</span>
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            <span class="member-status-text">{{ isOnline(m.lastSeen) ? 'オンライン' : 'オフライン' }}</span>
            <span class="status-dot" :class="isOnline(m.lastSeen) ? 'online' : 'offline'"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 全屏大图预览 -->
  <div class="image-viewer-overlay" v-if="previewImageUrl" @click="previewImageUrl = null">
    <img :src="previewImageUrl">
  </div>
</div>

<script>
  // 请替换为你自己的 Firebase 项目配置
  const firebaseConfig = {
    apiKey: "AIzaSyCgSTkHjL7y2GCU1v9F9eppQMyApoFBxXw",
    authDomain: "line-chat-app-4c77b.firebaseapp.com",
    projectId: "line-chat-app-4c77b",
    storageBucket: "line-chat-app-4c77b.firebasestorage.app",
    messagingSenderId: "585126145886",
    appId: "1:585126145886:web:c480b83daf9d1c7f7169cf"
  };
  
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const { createApp } = Vue;

  createApp({
    data() {
      return {
        user: { userId: '', displayName: '', pictureUrl: '' },
        currentGroup: { id: 'default-room', name: 'LINE オープンチャット' },
        messages: [],
        membersList: [],
        inputText: '',
        showPanel: false,
        showMembersModal: false,
        activeMsgId: null,
        liffId: '2011533536-4uHjOoWa', // 你的 LIFF ID
        // ⚠️【重要】：部署后端服务后，请将此处修改为你部署的实际 API 链接
        backendServerUrl: 'https://your-backend-api.onrender.com/api/line-login', 
        previewImageUrl: null,
        heartbeatTimer: null,
        nowTimestamp: Date.now()
      };
    },
    async mounted() {
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

      // 定时更新时间戳（用于在线状态计算）
      setInterval(() => {
        this.nowTimestamp = Date.now();
      }, 5000);

      try {
        // 1. 初始化 LIFF SDK
        await liff.init({ liffId: this.liffId });

        // 2. 检查 LINE 登录状态，未登录则自动跳转登录
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        // 3. 获得 LINE 的访问令牌 (accessToken) 及用户信息
        const accessToken = liff.getAccessToken();
        const profile = await liff.getProfile();

        // 4. 发送请求给后端 API，换取 Firebase 自定义 Token (Custom Token)
        const response = await fetch(this.backendServerUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            accessToken: accessToken,
            lineUid: profile.userId
          })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || '后端认证失败');
        }

        // 5. 使用 Firebase 自定义令牌登录 Auth 系统
        await firebase.auth().signInWithCustomToken(data.customToken);

        // 6. 成功登录 Firebase 后，读取头像与自定义信息
        let customAvatar = '';
        try {
          const userDoc = await db.collection('users').doc(profile.userId).get();
          if (userDoc.exists && userDoc.data().avatar) {
            customAvatar = userDoc.data().avatar;
          }
        } catch(e){}

        if (!customAvatar) {
          customAvatar = localStorage.getItem('custom_avatar_' + profile.userId) || '';
        }

        this.user = {
          userId: profile.userId,
          displayName: profile.displayName || 'LINEユーザー',
          pictureUrl: customAvatar || profile.pictureUrl || ''
        };

        // 7. 进入指定群组
        const urlParams = new URLSearchParams(window.location.search);
        const targetGroupId = urlParams.get('groupId') || 'default-room';
        
        this.joinGroup(targetGroupId);
      } catch (err) {
        console.error('登录流程出错:', err);
        alert('登录初始化失败: ' + err.message);
      }
    },
    methods: {
      handleImgError(e) {
        e.target.style.display = 'none';
      },

      getAvatarBgColor(identifier) {
        const colors = [
          '#E54D42', '#F37B1D', '#FBBD08', '#39B54A', 
          '#1CBBB4', '#0081FF', '#6739B6', '#9C26B0', 
          '#E03997', '#A5673F', '#06C755', '#2B85E4'
        ];
        let hash = 0;
        const str = identifier || 'user';
        for (let i = 0; i < str.length; i++) {
          hash = str.charCodeAt(i) + ((hash << 5) - hash);
        }
        return colors[Math.abs(hash) % colors.length];
      },

      isOnline(lastSeen) {
        if (!lastSeen) return false;
        const lastSeenTime = lastSeen.toDate ? lastSeen.toDate().getTime() : new Date(lastSeen).getTime();
        return (this.nowTimestamp - lastSeenTime) < 30000;
      },

      startHeartbeat() {
        this.updatePresence();
        if (this.heartbeatTimer) clearInterval(this.heartbeatTimer);
        this.heartbeatTimer = setInterval(() => {
          this.updatePresence();
        }, 10000);
      },

      async updatePresence() {
        if (!this.user.userId || !this.currentGroup.id) return;
        await db.collection('groups').doc(this.currentGroup.id).collection('members').doc(this.user.userId).set({
          uid: this.user.userId,
          displayName: this.user.displayName,
          avatar: this.user.pictureUrl || '',
          lastSeen: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });
      },

      listenMessages(groupId) {
        db.collection('groups').doc(groupId).collection('messages')
          .orderBy('timestamp', 'asc')
          .onSnapshot(snapshot => {
            this.messages = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            this.$nextTick(() => {
              if (this.$refs.chatBox) {
                this.$refs.chatBox.scrollTop = this.$refs.chatBox.scrollHeight;
              }
            });
          });

        db.collection('groups').doc(groupId).collection('members')
          .onSnapshot(snapshot => {
            this.membersList = snapshot.docs.map(doc => doc.data());
          });
      },

      async sendText() {
        if (!this.inputText.trim()) return;
        const text = this.inputText;
        this.inputText = '';
        this.showPanel = false;

        await db.collection('groups').doc(this.currentGroup.id).collection('messages').add({
          uid: this.user.userId || 'guest',
          displayName: this.user.displayName || 'LINEユーザー',
          avatar: this.user.pictureUrl || '',
          type: 'text',
          text: text,
          recalled: false,
          edited: false,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
      },

      triggerImageUpload() { this.$refs.fileInput.click(); },
      triggerAvatarUpload() { this.$refs.avatarInput.click(); },

      compressImage(file, maxWidth = 800, quality = 0.6) {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = (e) => {
            const img = new Image();
            img.src = e.target.result;
            img.onload = () => {
              let width = img.width;
              let height = img.height;
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              resolve(canvas.toDataURL('image/jpeg', quality));
            };
          };
        });
      },

      async uploadImage(e) {
        const file = e.target.files[0];
        if (!file) return;
        this.showPanel = false;
        try {
          const compressedBase64 = await this.compressImage(file, 800, 0.6);
          await db.collection('groups').doc(this.currentGroup.id).collection('messages').add({
            uid: this.user.userId || 'guest',
            displayName: this.user.displayName || 'LINEユーザー',
            avatar: this.user.pictureUrl || '',
            type: 'image',
            url: compressedBase64,
            recalled: false,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
        } catch (err) {
          alert('送信に失敗しました：' + err.message);
        }
        e.target.value = '';
      },

      toggleMenu(msgId) {
        this.activeMsgId = this.activeMsgId === msgId ? null : msgId;
      },

      async editMessage(msg) {
        const newText = prompt('メッセージを編集:', msg.text);
        this.activeMsgId = null;
        if (newText && newText !== msg.text) {
          await db.collection('groups').doc(this.currentGroup.id).collection('messages').doc(msg.id).update({
            text: newText,
            edited: true
          });
        }
      },

      async recallMessage(msgId) {
        this.activeMsgId = null;
        await db.collection('groups').doc(this.currentGroup.id).collection('messages').doc(msgId).update({
          recalled: true
        });
      },

      async createGroup() {
        const name = prompt('新しいグループ名を入力してください:');
        if (!name) return;
        const groupRef = await db.collection('groups').add({
          name: name,
          owner: this.user.userId || 'guest'
        });
        this.joinGroup(groupRef.id);
      },

      async joinGroup(groupId) {
        const doc = await db.collection('groups').doc(groupId).get();
        if (doc.exists) {
          this.currentGroup = { id: doc.id, ...doc.data() };
        } else {
          this.currentGroup = { id: groupId, name: 'LINE オープンチャット' };
          await db.collection('groups').doc(groupId).set({ name: 'LINE オープンチャット' });
        }
        this.listenMessages(groupId);
        this.startHeartbeat();
      },

      shareGroup() {
        const shareUrl = `https://liff.line.me/${this.liffId}?groupId=${this.currentGroup.id}`;
        if (liff.isApiAvailable('shareTargetPicker')) {
          liff.shareTargetPicker([{
            type: "text",
            text: `LINEチャットグループ【${this.currentGroup.name}】に招待されています。こちらから参加してください：${shareUrl}`
          }]);
        } else {
          prompt('以下のリンクをコピーして共有してください：', shareUrl);
        }
      },

      previewImage(url) { this.previewImageUrl = url; }
    }
  }).mount('#app');
</script>
</body>
</html>
