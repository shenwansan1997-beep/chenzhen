<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>消息界面预览</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #f7f7f7;
      display: flex;
      justify-content: center;
    }

    /* 模拟手机/卡片容器 */
    .app-container {
      width: 100%;
      max-width: 414px;
      height: 100vh;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
    }

    /* 顶部 App Header */
    .header {
      padding: 16px;
      background-color: #ffffff;
      border-bottom: 1px solid #f0f0f0;
    }
    .header-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .app-logo {
      width: 28px;
      height: 28px;
      background-color: #07c160;
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
    }
    .app-name {
      font-size: 18px;
      font-weight: bold;
      color: #000;
    }
    .page-title {
      font-size: 24px;
      font-weight: 800;
      color: #111;
    }

    /* 消息列表区域 */
    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 60px; /* 留出底部导航栏的高度 */
    }

    /* 单条消息列表项 */
    .chat-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #f5f5f5;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .chat-item:active {
      background-color: #f9f9f9;
    }

    /* 头像 */
    .avatar {
      width: 48px;
      height: 48px;
      background-color: #07c160;
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      flex-shrink: 0;
    }

    /* 中间内容 */
    .chat-content {
      flex: 1;
      margin: 0 12px;
      overflow: hidden;
    }
    .chat-title {
      font-size: 16px;
      font-weight: 700;
      color: #111111;
      margin-bottom: 4px;
    }
    .chat-preview {
      font-size: 13px;
      color: #888888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 右侧元信息（时间与未读数） */
    .chat-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }
    .chat-time {
      font-size: 12px;
      color: #b2b2b2;
    }

    /* 红点角标 */
    .badge {
      background-color: #ff3b30;
      color: #ffffff;
      font-size: 11px;
      font-weight: bold;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      box-sizing: border-box;
    }

    /* 底部固定导航栏 */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: #ffffff;
      border-top: 1px solid #eaeaea;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #8a8a8e;
      font-size: 11px;
      text-decoration: none;
      width: 25%;
    }

    /* 图标包裹层（实现红点定位） */
    .icon-wrapper {
      position: relative;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 自定义图标样式 */
    .nav-icon {
      width: 24px;
      height: 24px;
      border: 2px solid #8a8a8e;
      border-radius: 50%;
      box-sizing: border-box;
    }
    
    .nav-icon.diamond {
      border-radius: 4px;
      transform: rotate(45deg);
      width: 20px;
      height: 20px;
      margin: 2px;
    }

    /* 导航栏角标绝对定位 */
    .icon-wrapper .badge {
      position: absolute;
      top: -4px;
      right: -8px;
    }

    /* 激活高亮状态 */
    .nav-item.active {
      color: #07c160;
    }
    .nav-item.active .nav-icon {
      border-color: #07c160;
      background-color: #07c160;
      box-shadow: inset 0 0 0 3px #fff; /* 内部白圈效果 */
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 顶部 Header -->
    <div class="header">
      <div class="header-top">
        <div class="app-logo">S</div>
        <div class="app-name">AI Sochi</div>
      </div>
      <div class="page-title">消息</div>
    </div>

    <!-- 消息列表（带右侧时间） -->
    <div class="chat-list">
      <div class="chat-item">
        <div class="avatar">A</div>
        <div class="chat-content">
          <div class="chat-title">AI Sōchi</div>
          <div class="chat-preview">アナリスト「佐藤真奈美」の追加方法が分からない場合は、以下のリンクを開いて追...</div>
        </div>
        <div class="chat-meta">
          <span class="chat-time">18:49</span>
          <span class="badge">1</span>
        </div>
      </div>

      <div class="chat-item">
        <div class="avatar">T</div>
        <div class="chat-content">
          <div class="chat-title">TRSHGBTRHT</div>
          <div class="chat-preview">去你的</div>
        </div>
        <div class="chat-meta">
          <span class="chat-time">16:37</span>
          <span class="badge">1</span>
        </div>
      </div>
    </div>

    <!-- 底部导航栏 -->
    <div class="bottom-nav">
      <div class="nav-item active">
        <div class="icon-wrapper">
          <div class="nav-icon"></div>
          <span class="badge">2</span>
        </div>
        <span>消息</span>
      </div>
      <div class="nav-item">
        <div class="icon-wrapper">
          <div class="nav-icon"></div>
        </div>
        <span>好友</span>
      </div>
      <div class="nav-item">
        <div class="icon-wrapper">
          <div class="nav-icon diamond"></div>
          <span class="badge">4</span>
        </div>
        <span>群组</span>
      </div>
      <div class="nav-item">
        <div class="icon-wrapper">
          <div class="nav-icon"></div>
        </div>
        <span>我的</span>
      </div>
    </div>
  </div>

</body>
</html>
