<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LINE Multi-Group Chat</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, sans-serif; background: #e5ddd5; }
    #app { display: flex; flex-direction: column; height: 100vh; }
    
    .header { height: 50px; background: #075e54; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; }
    .header .btn-group { display: flex; gap: 4px; }
    .header .btn { background: #128c7e; border: none; color: white; padding: 5px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }

    .chat-body { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 80%; padding: 8px 10px; border-radius: 8px; font-size: 14px; word-break: break-all; }
    .msg-left { background: #fff; align-self: flex-start; }
    .msg-right { background: #dcf8c6; align-self: flex-end; }
    .msg-sys { background: rgba(255,255,255,0.8); align-self: center; font-size: 12px; color: #555; text-align: center; }
    
    .sender { font-size: 10px; color: #075e54; font-weight: bold; }
    .meta { font-size: 10px; color: #888; text-align: right; margin-top: 4px; display: flex; justify-content: flex-end; gap: 6px; }
    .read-status { color: #34b7f1; cursor: pointer; text-decoration: underline; }
    .del-btn { color: red; cursor: pointer; }

    .footer { height: 55px; background: #f0f0f0; display: flex; align-items: center; padding: 0 8px; gap: 6px; }
    .footer input { flex: 1; height: 36px; border: 1px solid #ccc; border-radius: 18px; padding: 0 12px; outline: none; }
    .footer button { background: #075e54; color: white; border: none; height: 36px; padding: 0 15px; border-radius: 18px; cursor: pointer; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
    .modal-box { background: white; padding: 18px; border-radius: 12px; width: 85%; max-width: 320px; text-align: center; max-height: 80vh; display: flex; flex-direction: column; }
    .modal-box input { width: 100%; height: 36px; margin: 10px 0; padding: 0 8px; border: 1px solid #ccc; border-radius: 6px; }
    .modal-box button { background: #075e54; color: white; border: none; padding: 8px 14px; border-radius: 6px; margin: 4px; cursor: pointer; font-size: 12px; }
    
    .list-container { flex: 1; overflow-y: auto; text-align: left; margin: 10px 0; border: 1px solid #eee; border-radius: 6px; padding: 8px; }
    .list-item { padding: 8px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .list-item:last-child { border-bottom: none; }
    .role-badge { font-size: 10px; background: #25d366; color: white; padding: 2px 5px; border-radius: 4px; }
  </style>
</head>
<body>

<div id="app">
  <div class="header">
    <div>
      <b id="group-title">群聊</b>
      <div id="user-info" style="font-size: 10px; opacity: 0.8;">登录验证中...</div>
    </div>
    <div class="btn-group">
      <button class="btn" onclick="showCreateModal()">➕ 建新群</button>
      <button class="btn" onclick="showMembersModal()">👥 成员</button>
      <button class="btn" onclick="doCheckIn()">📍 签到</button>
      <button class="btn" id="admin-btn" style="display:none;" onclick="toggleMute()">🔕 禁言</button>
    </div>
  </div>

  <div class="chat-body" id="chat-body"></div>

  <div class="footer">
    <input type="text" id="msg-input" placeholder="发送消息..." />
    <button onclick="sendMsg()">发送</button>
  </div>
</div>

<!-- 建群弹窗 -->
<div class="modal" id="create-modal">
  <div class="modal-box">
    <h3>创建新群聊</h3>
    <input type="text" id="new-group-name-input" placeholder="输入群聊名字" />
    <div>
      <button onclick="confirmCreateGroup()">确定创建</button>
      <button style="background:#ccc; color:#333;" onclick="closeModal('create-modal')">取消</button>
    </div>
  </div>
</div>

<!-- 邀请分享弹窗 -->
<div class="modal" id="share-modal">
  <div class="modal-box">
    <h3 style="color:#075e54;">🎉 建群成功！</h3>
    <p style="font-size:12px; margin:8px 0; color:#666;">把下方专属链接发给朋友，对方点击即可加入此群：</p>
    <input type="text" id="share-url-input" readonly style="background:#f5f5f5;" />
    <div>
      <button onclick="copyGroupLink()">📋 一键复制链接</button>
      <button onclick="enterNewGroup()">🚀 进入新群</button>
    </div>
  </div>
</div>

<!-- 成员弹窗 -->
<div class="modal" id="members-modal">
  <div class="modal-box">
    <h3>👥 群成员列表</h3>
    <div class="list-container" id="members-list"></div>
    <button style="background:#ccc; color:#333;" onclick="closeModal('members-modal')">关闭</button>
  </div>
</div>

<!-- 已读弹窗 -->
<div class="modal" id="read-users-modal">
  <div class="modal-box">
    <h3>👁️ 已读成员列表</h3>
    <div class="list-container" id="read-users-list"></div>
    <button style="background:#ccc; color:#333;" onclick="closeModal('read-users-modal')">关闭</button>
  </div>
</div>

<script>
  // Firebase 实时数据库配置
  const firebaseConfig = {
    databaseURL: "https://chenzhen-640c8-default-rtdb.firebaseio.com"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // ⚠️【注意】：必须在此填入你的 LINE Developers 官方 LIFF ID！
  const MY_LIFF_ID = "2011537570-xxxxxxx"; 

  let currentUser = { id: '', name: '' };
  let groupId = ''; 
  let groupState = { ownerId: '', isMuted: false, groupName: '' };
  let createdGroupUrl = '';
  let newlyCreatedGroupId = '';

  function getQueryParam(param) {
    return new URLSearchParams(window.location.search).get(param);
  }

  async function initApp() {
    try {
      // 1. 初始化 LIFF SDK
      await liff.init({ liffId: MY_LIFF_ID });

      if (liff.isInClient() || liff.isLoggedIn()) {
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        const profile = await liff.getProfile();
        currentUser.id = profile.userId;
        currentUser.name = profile.displayName;
      } else {
        // 如果在普通浏览器或 Telegram 打开，自动切换为开发测试用户
        throw new Error("非 LINE 环境，开启测试模式");
      }
    } catch (e) {
      console.warn("LIFF 登录跳过:", e.message);
      // 自动降级为测试模拟用户，方便网页端预览
      currentUser.id = "user_" + Math.floor(1000 + Math.random() * 9000);
      currentUser.name = "测试用户_" + currentUser.id.slice(-4);
    }

    document.getElementById('user-info').innerText = `当前用户: ${currentUser.name}`;

    // 获取当前群组 ID
    const urlGroupId = getQueryParam('groupId');
    if (urlGroupId) {
      groupId = urlGroupId;
      localStorage.setItem('current_group_id', groupId);
    } else {
      groupId = localStorage.getItem('current_group_id') || "group_default_001";
    }

    // 更新成员节点
    db.ref(`groups/${groupId}/members/${currentUser.id}`).set({
      name: currentUser.name,
      lastSeen: Date.now()
    });

    // 监听群配置
    db.ref(`groups/${groupId}/config`).on('value', snapshot => {
      const config = snapshot.val() || {};
      if (!config.ownerId) {
        config.ownerId = currentUser.id;
        config.groupName = "主群聊";
        config.isMuted = false;
        db.ref(`groups/${groupId}/config`).set(config);
      }

      groupState = config;
      document.getElementById('group-title').innerText = config.groupName || "群聊";

      const isOwner = currentUser.id === groupState.ownerId;
      document.getElementById('admin-btn').style.display = isOwner ? 'inline-block' : 'none';
      document.getElementById('admin-btn').innerText = groupState.isMuted ? "🔔 解禁" : "🔕 禁言";
    });

    listenMessages();
  }

  function showCreateModal() {
    document.getElementById('create-modal').style.display = 'flex';
  }

  function confirmCreateGroup() {
    const nameInput = document.getElementById('new-group-name-input');
    const groupName = nameInput.value.trim();
    if (!groupName) { alert("请输入群名字！"); return; }

    newlyCreatedGroupId = "group_" + Date.now();

    db.ref(`groups/${newlyCreatedGroupId}/config`).set({
      ownerId: currentUser.id,
      groupName: groupName,
      isMuted: false,
      createdAt: Date.now()
    });

    db.ref(`groups/${newlyCreatedGroupId}/members/${currentUser.id}`).set({
      name: currentUser.name,
      lastSeen: Date.now()
    });

    // 生成正确带群 ID 的 LIFF 跳转 URL
    createdGroupUrl = `https://liff.line.me/${MY_LIFF_ID}?groupId=${newlyCreatedGroupId}`;

    closeModal('create-modal');
    nameInput.value = '';

    document.getElementById('share-url-input').value = createdGroupUrl;
    document.getElementById('share-modal').style.display = 'flex';
  }

  function copyGroupLink() {
    const input = document.getElementById('share-url-input');
    input.select();
    input.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(input.value).then(() => {
      alert("专属群链接已复制！分享给好友，对方在 LINE 打开即可加入。");
    }).catch(() => {
      document.execCommand("copy");
      alert("专属群链接已复制！");
    });
  }

  function enterNewGroup() {
    localStorage.setItem('current_group_id', newlyCreatedGroupId);
    window.location.href = createdGroupUrl;
  }

  function showMembersModal() {
    db.ref(`groups/${groupId}/members`).once('value', snapshot => {
      const members = snapshot.val() || {};
      const container = document.getElementById('members-list');
      container.innerHTML = '';

      Object.keys(members).forEach(uid => {
        const member = members[uid];
        const isOwner = uid === groupState.ownerId;
        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = `
          <span><b>${member.name || '未知用户'}</b></span>
          ${isOwner ? '<span class="role-badge">👑 群主</span>' : '<span style="font-size:11px;color:#888;">成员</span>'}
        `;
        container.appendChild(item);
      });

      document.getElementById('members-modal').style.display = 'flex';
    });
  }

  function listenMessages() {
    db.ref(`groups/${groupId}/messages`).on('value', snapshot => {
      const data = snapshot.val() || {};
      const chatBody = document.getElementById('chat-body');
      chatBody.innerHTML = '';

      Object.keys(data).forEach(msgId => {
        const msg = data[msgId];
        
        if (!msg.readBy || !msg.readBy[currentUser.id]) {
          db.ref(`groups/${groupId}/messages/${msgId}/readBy/${currentUser.id}`).set({
            name: currentUser.name,
            time: Date.now()
          });
        }
        renderMsgCard(msgId, msg, chatBody);
      });
      chatBody.scrollTop = chatBody.scrollHeight;
    });
  }

  function renderMsgCard(msgId, msg, container) {
    const div = document.createElement('div');
    const isMe = msg.senderId === currentUser.id;
    const isOwner = currentUser.id === groupState.ownerId;

    if (msg.type === 'system') {
      div.className = 'msg msg-sys';
      div.innerText = msg.text;
    } else {
      div.className = `msg ${isMe ? 'msg-right' : 'msg-left'}`;
      const readCount = msg.readBy ? Object.keys(msg.readBy).length : 0;

      div.innerHTML = `
        <div class="sender">${msg.senderName}</div>
        <div>${msg.text}</div>
        <div class="meta">
          <span class="read-status" onclick="showReadUsersModal('${msgId}')">已读 (${readCount})</span>
          ${isOwner ? `<span class="del-btn" onclick="delMsg('${msgId}')">删除</span>` : ''}
        </div>
      `;
    }
    container.appendChild(div);
  }

  function showReadUsersModal(msgId) {
    db.ref(`groups/${groupId}/messages/${msgId}/readBy`).once('value', snapshot => {
      const readData = snapshot.val() || {};
      const container = document.getElementById('read-users-list');
      container.innerHTML = '';

      const uids = Object.keys(readData);
      if (uids.length === 0) {
        container.innerHTML = '<div style="font-size:12px;color:#888;text-align:center;">暂无已读记录</div>';
      } else {
        uids.forEach(uid => {
          const itemData = readData[uid];
          const name = typeof itemData === 'object' ? itemData.name : itemData;
          const item = document.createElement('div');
          item.className = 'list-item';
          item.innerHTML = `
            <span><b>${name || '匿名成员'}</b></span>
            <span style="font-size:10px; color:#aaa;">已阅读</span>
          `;
          container.appendChild(item);
        });
      }

      document.getElementById('read-users-modal').style.display = 'flex';
    });
  }

  function sendMsg() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text) return;

    if (groupState.isMuted && currentUser.id !== groupState.ownerId) {
      alert("全员禁言中，仅群主可发言");
      return;
    }

    const newMsgRef = db.ref(`groups/${groupId}/messages`).push();
    newMsgRef.set({
      senderId: currentUser.id,
      senderName: currentUser.name,
      text: text,
      timestamp: Date.now(),
      readBy: {
        [currentUser.id]: { name: currentUser.name, time: Date.now() }
      }
    });

    input.value = '';
  }

  function doCheckIn() {
    const userSignRef = db.ref(`groups/${groupId}/checkins/${currentUser.id}`);
    userSignRef.transaction(currentCount => {
      return (currentCount || 0) + 1;
    }, (error, committed, snapshot) => {
      if (committed) {
        db.ref(`groups/${groupId}/messages`).push({
          type: 'system',
          text: `📢 签到公告: [${currentUser.name}] 完成签到！累计签到 ${snapshot.val()} 次`
        });
      }
    });
  }

  function toggleMute() {
    if (currentUser.id !== groupState.ownerId) return;
    db.ref(`groups/${groupId}/config/isMuted`).set(!groupState.isMuted);
  }

  function delMsg(msgId) {
    if (currentUser.id !== groupState.ownerId) return;
    if (confirm("确定删除此消息？")) {
      db.ref(`groups/${groupId}/messages/${msgId}`).remove();
    }
  }

  function closeModal(id) {
    document.getElementById(id).style.display = 'none';
  }

  window.onload = initApp;
</script>
</body>
</html>
