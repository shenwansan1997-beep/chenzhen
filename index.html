从现象来看，消息并没有真正发送 3 次（重新进入界面变回 1 条说明数据库记录正常），而是发送时界面在短时间内**重复插入了本地 UI 节点**（例如发送触发了 3 次 UI 刷新，或者乐观更新 Local UI 时产生了重复的假消息），退出再进入重新拉取本地数据库/服务端数据后，UI 恢复正常。

### **核心修复方案**

如果你是开发人员，需要在代码逻辑中做以下几处修正：

**1. 增加本地唯一 ID 去重校验（客户端）**
在将消息 append 到当前 UI 列表前，通过消息的临时本地 ID（如 `local_msg_id` 或 `client_uuid`）判断列表中是否已存在该消息，存在则仅更新状态，不重复追加：

```javascript
// 示例（以前端/App逻辑为例）
function appendMessageToUI(newMessage) {
    const exists = messageList.some(msg => msg.localId === newMessage.localId);
    if (!exists) {
        messageList.push(newMessage);
    } else {
        // 如果存在，仅更新消息发送状态（如：发送中 -> 发送成功）
        updateMessageStatus(newMessage);
    }
}
